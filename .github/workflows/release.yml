# Spec section 11: one commit produces both artefacts, with the version derived
# from the tag. Portable single-file executables for both targets -- no runtime
# and nothing for the user to install. Each job then packages its own executable
# a second time, for people who would rather their system tracked the file than
# manage it themselves: a .deb on Linux, an .msi on Windows. Neither replaces
# the portable executable.
#
# The toolchain is pinned by rust-toolchain.toml, which both jobs pick up
# automatically, so the same commit builds the same binary on either runner.
name: release

on:
  push:
    tags: ["v*"]
  # Buildable on demand too, so the packaging path is exercised without cutting
  # a release. Without a tag the version in Cargo.toml stands.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artefact: simple-3d-linux-x86_64
            binary: simple-3d
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            artefact: simple-3d-windows-x86_64.exe
            binary: simple-3d.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Built on the oldest runner image still in support, against its system
      # glibc, so the result runs on distributions still receiving support at
      # build time without the user installing anything.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          # Kept in step with rust-toolchain.toml.
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The tag is the single source of truth for the version, so a release can
      # never disagree with what the About dialog reports.
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "Building version $version"
          perl -0pi -e "s/^(\[workspace\.package\]\nversion = )\"[^\"]*\"/\$1\"$version\"/m" Cargo.toml
          grep -A1 '^\[workspace.package\]' Cargo.toml

      - name: Test
        run: cargo test --workspace --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p simple3d-app

      - name: Stage the artefact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artefact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefact }}
          path: dist/${{ matrix.artefact }}
          if-no-files-found: error

      # The Windows counterpart of the .deb below: the same executable, in an
      # installer that puts it in Program Files and offers a Start menu entry
      # and a desktop shortcut, either of which can be turned off in the
      # installer's feature tree. The portable .exe above is still the first
      # artefact; this is for people who would rather not keep track of a file.
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          Write-Host "Building the installer for version $version"
          wix build -arch x64 `
            -d "Version=$version" `
            -d "ExePath=$PWD\target\${{ matrix.target }}\release\simple-3d.exe" `
            -ext WixToolset.UI.wixext `
            packaging/windows/simple-3d.wxs `
            -o dist/simple-3d-windows-x86_64.msi

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: simple-3d-msi
          path: dist/*.msi
          if-no-files-found: error

      # An addition to the portable executable above, never a replacement for
      # it: the same binary, plus the desktop entry, icon and MIME type that
      # put it in the applications menu and open .simple3d files by double
      # click. Built from the version in Cargo.toml, which the tag step above
      # has already rewritten, so the two artefacts can never disagree.
      - name: Build the Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          [ -n "$version" ] || { echo "no version found in Cargo.toml" >&2; exit 1; }
          packaging/deb/build.sh "dist/${{ matrix.artefact }}" "$version" dist
          dpkg-deb -I dist/*.deb

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: simple-3d-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
