# Spec section 11: one commit produces both artefacts, with the version derived
# from the tag. Portable single-file executables for both targets -- no
# installer, no runtime, nothing for the user to install.
#
# The toolchain is pinned by rust-toolchain.toml, which both jobs pick up
# automatically, so the same commit builds the same binary on either runner.
name: release

on:
  push:
    tags: ["v*"]
  # Buildable on demand too, so the packaging path is exercised without cutting
  # a release. Without a tag the version in Cargo.toml stands.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artefact: simple-3d-linux-x86_64
            binary: simple-3d
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            artefact: simple-3d-windows-x86_64.exe
            binary: simple-3d.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Built on the oldest runner image still in support, against its system
      # glibc, so the result runs on distributions still receiving support at
      # build time without the user installing anything.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          # Kept in step with rust-toolchain.toml.
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The tag is the single source of truth for the version, so a release can
      # never disagree with what the About dialog reports.
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "Building version $version"
          perl -0pi -e "s/^(\[workspace\.package\]\nversion = )\"[^\"]*\"/\$1\"$version\"/m" Cargo.toml
          grep -A1 '^\[workspace.package\]' Cargo.toml

      - name: Test
        run: cargo test --workspace --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p simple3d-app

      - name: Stage the artefact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artefact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefact }}
          path: dist/${{ matrix.artefact }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
