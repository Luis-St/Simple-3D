[workspace]
resolver = "2"
members = [
    "crates/scadstudio-core",
    "crates/scadstudio-geom",
    "crates/scadstudio-export",
    "crates/scadstudio-app",
]

# The release workflow rewrites `version` here from the pushed tag with a regex
# anchored on this heading, so `version` stays the first key under it.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Luis-St/Simple-3D"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "unwind"
