<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- The `<svg` tag stays within the first bytes of the file: gdk-pixbuf
       recognises an SVG by sniffing the start of it, and a comment above this
       line pushes the tag out of that window, whereupon GNOME Shell shows an
       empty tile instead of the icon. packaging/deb/build.sh checks this.

       The glyph is the box the tool rail draws (crates/simple3d-app/src/icon.rs)
       in the same house style: geometric strokes in the accent colour on the
       darkest surface. Written out here because a desktop entry needs an icon
       file on disk, which the single-binary build deliberately has none of. -->
  <rect width="64" height="64" rx="12" ry="12" fill="#15181C"/>
  <g transform="translate(6.4 6.4) scale(0.8)"
     fill="none" stroke="#E8A33D" stroke-width="5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.4 21.76 L32 8.96 L57.6 21.76 L57.6 46.08 L32 58.88 L6.4 46.08 Z"/>
    <path d="M6.4 21.76 L32 33.28 L57.6 21.76"/>
    <path d="M32 33.28 L32 58.88"/>
  </g>
</svg>
